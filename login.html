<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود | موبیکس</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <!-- لوگو -->
            <a href="index.html" class="auth-logo">
                MOBIX
            </a>

            <!-- عنوان -->
            <h1 id="auth-title">
                ورود به حساب
            </h1>

            <p class="auth-description">
                به حساب کاربری موبیکس خودت وارد شو
            </p>


            <!-- فرم ورود -->
            <form id="login-form">

                <div class="input-group">

                    <label>
                        شماره موبایل
                    </label>

                    <input
                        type="tel"
                        id="login-phone"
                        placeholder="مثلاً 09121234567"
                        required>

                </div>


                <div class="input-group">

                    <label>
                        رمز عبور
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="رمز عبور"
                        required>

                </div>


                <button
                    type="submit"
                    class="auth-btn">

                    ورود

                </button>

            </form>


            <!-- فرم ثبت نام -->
            <form id="register-form" class="hidden">

                <div class="input-group">

                    <label>
                        نام
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        placeholder="نام"
                        required>

                </div>


                <div class="input-group">

                    <label>
                        نام خانوادگی
                    </label>

                    <input
                        type="text"
                        id="register-family"
                        placeholder="نام خانوادگی"
                        required>

                </div>


                <div class="input-group">

                    <label>
                        شماره موبایل
                    </label>

                    <input
                        type="tel"
                        id="register-phone"
                        placeholder="مثلاً 09121234567"
                        required>

                </div>


                <div class="input-group">

                    <label>
                        ایمیل
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="example@gmail.com"
                        required>

                </div>


                <div class="input-group">

                    <label>
                        رمز عبور
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="حداقل ۶ کاراکتر"
                        required>

                </div>


                <button
                    type="submit"
                    class="auth-btn">

                    ثبت نام

                </button>

            </form>


            <!-- تغییر حالت -->
            <div class="auth-switch">

                <span id="switch-text">
                    حساب کاربری نداری؟
                </span>

                <button id="switch-auth">
                    ثبت نام
                </button>

            </div>


            <!-- پیام -->
            <p id="auth-message"></p>


            <a href="index.html" class="back-home">
                ← بازگشت به فروشگاه
            </a>
            </div>

    </main>


    <script src="auth.js"></script>

</body>

</html>
