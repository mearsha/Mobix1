<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>پروفایل | موبیکس</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <!-- Header -->

    <header class="header">

        <div class="container header-content">

            <a
                href="index.html"
                class="logo">

                MOBIX

                <span>
                    موبیکس
                </span>

            </a>


            <a href="index.html" class="back-button">
                برگشت به خانه
            </a>

        </div>

    </header>



    <!-- Profile -->

    <main class="profile-page">

        <div class="container">


            <div class="section-title">

                <span>
                    حساب کاربری
                </span>

                <h1>
                    پروفایل من
                </h1>

            </div>



            <div class="profile-card">


                <div class="profile-avatar">
                    👤
                </div>


                <div class="profile-info">

                    <h2 id="profile-name">
                        کاربر
                    </h2>

                    <p id="profile-phone">
                        -
                    </p>

                    <p id="profile-email">
                        -
                    </p>

                </div>


                <button
                    id="logout-button"
                    class="logout-btn">

                    خروج از حساب

                </button>

            </div>


        </div>

    </main>


    <script src="profile.js"></script>

</body>

</html>
